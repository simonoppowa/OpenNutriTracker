version: 2

updates:
  - package-ecosystem: "bundler"
    directory: "/ios"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 10
    groups:
      ios-bundler:
        patterns:
          - "*"

  - package-ecosystem: "bundler"
    directory: "/android"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 10
    groups:
      android-bundler:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 10
    groups:
      pub:
        patterns:
          - "*"
    # Dependabot resolves with its own Dart, not the Flutter 3.44.6 in
    # .fvmrc. These three are held back because their newer versions need
    # analyzer >=13, whose meta ^1.18.3 the SDK's flutter_test cannot
    # satisfy (see #1192). Drop the entries on the next Flutter bump.
    ignore:
      - dependency-name: "build_runner"
      - dependency-name: "hive_ce_generator"
      - dependency-name: "mockito"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
