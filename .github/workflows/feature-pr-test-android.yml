name: Feature PR-Test Android APK
run-name: PR-Test APK (${{ github.ref_name }})

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pr-test-apk:
    name: Build feature PR-test debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Flutter version from .fvmrc
        id: read_flutter_version
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter and cache packages
        uses: ./.github/actions/setup-flutter-cache
        with:
          flutter-version: ${{ steps.read_flutter_version.outputs.version }}

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create stub environment for validation
        uses: ./.github/actions/write-env-file
        with:
          sentry_dns: https://stub@sentry.io/0
          supabase_project_url: https://stub.supabase.co
          supabase_project_anon_key: ci-stub

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Test food search logic
        run: >-
          flutter test
          test/unit_test/products_bloc_search_test.dart
          test/unit_test/search_products_usecase_test.dart

      - name: Check optional food database configuration
        id: backend
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PROJECT_ANON_KEY: ${{ secrets.SUPABASE_PROJECT_ANON_KEY }}
        run: |
          if [[ -z "$SUPABASE_PROJECT_URL" || -z "$SUPABASE_PROJECT_ANON_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Building with Supabase placeholders. Open Food Facts and local foods remain available; Supabase food search needs project configuration."
            echo "Supabase is not configured. This APK can use Open Food Facts and local foods, but Supabase reference-food search will be unavailable." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create environment with Supabase configuration
        if: steps.backend.outputs.configured == 'true'
        uses: ./.github/actions/write-env-file
        with:
          sentry_dns: https://stub@sentry.io/0
          supabase_project_url: ${{ secrets.SUPABASE_PROJECT_URL }}
          supabase_project_anon_key: ${{ secrets.SUPABASE_PROJECT_ANON_KEY }}

      - name: Regenerate Dart sources with search credentials
        if: steps.backend.outputs.configured == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build feature PR-test debug APK
        run: flutter build apk --flavor prtest --debug

      - name: Upload PR-test APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenNutriTracker-PR-Test
          path: build/app/outputs/flutter-apk/app-prtest-debug.apk
          if-no-files-found: error
          retention-days: 14
